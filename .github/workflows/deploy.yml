name: Deploy PWA to GitHub Pages

# 정적 PWA 를 GitHub Pages 로 배포한다.
# 기본 브랜치 push 시 자동 배포되며, 수동 실행(workflow_dispatch)도 가능하다.
on:
  push:
    branches: [main, claude/donggudial-pwa-contacts-vda1jn]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 동시에 한 번만 배포 (진행 중 배포는 취소하지 않고 큐잉)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages 사이트가 없으면 자동 생성(수동 Settings 설정 불필요)
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # 저장소 루트가 곧 사이트 루트 (정적 파일)
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
