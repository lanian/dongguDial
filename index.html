<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1f6feb" />
  <meta name="description" content="동구 비상연락망 - 부서별 직원 연락처" />
  <title>비상연락망</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="비상연락망" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <div class="app-bar-top">
      <h1 class="app-title">비상연락망</h1>
      <button id="settings-btn" class="icon-btn icon-btn--bar" aria-label="설정 및 백업">⚙</button>
    </div>
    <div class="search-wrap">
      <input id="search-input" class="search-input" type="search"
             placeholder="이름·부서·전화번호 검색" autocomplete="off" enterkeyhint="search" />
      <button id="search-clear" class="search-clear" aria-label="검색 지우기" hidden>×</button>
    </div>
  </header>

  <nav class="tabs" role="tablist">
    <button class="tab is-active" data-tab="all" role="tab">전체</button>
    <button class="tab" data-tab="favorites" role="tab">즐겨찾기</button>
    <button class="tab" data-tab="recent" role="tab">최근</button>
  </nav>

  <main id="list" class="list" aria-live="polite"></main>

  <!-- 상세 화면 (오버레이) -->
  <section id="detail" class="detail" hidden>
    <header class="detail-bar">
      <button id="detail-back" class="icon-btn" aria-label="뒤로">←</button>
      <span class="detail-bar-title">연락처 정보</span>
      <button id="detail-fav" class="icon-btn" aria-label="즐겨찾기 토글">☆</button>
    </header>
    <div id="detail-body" class="detail-body"></div>
  </section>

  <!-- 설정 / 백업·복구 (오버레이) -->
  <section id="settings" class="detail" hidden>
    <header class="detail-bar">
      <button id="settings-back" class="icon-btn" aria-label="뒤로">←</button>
      <span class="detail-bar-title">설정</span>
    </header>
    <div class="detail-body">
      <div class="info-card">
        <div class="info-row">
          <span class="info-ico">⭐</span>
          <div class="info-text">
            <div class="info-label">저장된 데이터</div>
            <div class="info-value" id="settings-counts">즐겨찾기 0 · 최근 0</div>
          </div>
        </div>
      </div>

      <div class="settings-section-title">데이터 백업 / 복구</div>
      <div class="info-card">
        <button class="settings-action" id="export-btn">
          <span class="info-ico">⬇️</span>
          <div class="info-text">
            <div class="info-value">백업 내보내기</div>
            <div class="info-label">즐겨찾기·최근을 JSON 파일로 저장</div>
          </div>
        </button>
        <button class="settings-action" id="import-btn">
          <span class="info-ico">⬆️</span>
          <div class="info-text">
            <div class="info-value">백업 가져오기</div>
            <div class="info-label">JSON 백업 파일에서 복구(병합)</div>
          </div>
        </button>
      </div>
      <p class="settings-note">
        가져오기는 기존 데이터에 <b>병합</b>됩니다. 연락처 정보 자체는 앱에 포함되어 있어
        백업 대상이 아니며, 개인 설정(즐겨찾기·최근)만 백업됩니다.
      </p>
    </div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
  </section>

  <!-- 설치 안내 토스트 -->
  <div id="install-toast" class="toast" hidden>
    <span>홈 화면에 설치할 수 있어요</span>
    <button id="install-btn" class="toast-btn">설치</button>
    <button id="install-dismiss" class="toast-dismiss" aria-label="닫기">×</button>
  </div>

  <div id="update-toast" class="toast" hidden>
    <span>새 버전이 있습니다</span>
    <button id="update-btn" class="toast-btn">새로고침</button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
