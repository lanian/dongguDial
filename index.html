<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#1f6feb" />
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121316" />
  <meta name="description" content="동구 행정전화부 - 부서별 직원 연락처" />
  <title>행정전화부</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon-192.png" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="행정전화부" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- 인라인 SVG 스프라이트 (currentColor 상속, no-build) -->
  <svg style="display:none" aria-hidden="true" focusable="false" xmlns="http://www.w3.org/2000/svg">
    <symbol id="ic-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></symbol>
    <symbol id="ic-close" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
    <symbol id="ic-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></symbol>
    <symbol id="ic-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></symbol>
    <symbol id="ic-star" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></symbol>
    <symbol id="ic-phone" viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></symbol>
    <symbol id="ic-message" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="ic-mobile" viewBox="0 0 24 24"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M12 18h.01"/></symbol>
    <symbol id="ic-building" viewBox="0 0 24 24"><path d="M3 21h18M6 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16M9 7h.01M9 11h.01M9 15h.01M14 7h.01M14 11h.01M14 15h.01"/></symbol>
    <symbol id="ic-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="ic-badge" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M7 16a2.5 2.5 0 0 1 5 0M15 9h3M15 13h2"/></symbol>
    <symbol id="ic-work" viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></symbol>
    <symbol id="ic-cake" viewBox="0 0 24 24"><path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1M2 21h20M7 8v3M12 8v3M17 8v3M7 4h.01M12 4h.01M17 4h.01"/></symbol>
    <symbol id="ic-status" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></symbol>
    <symbol id="ic-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></symbol>
    <symbol id="ic-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/></symbol>
    <symbol id="ic-bookmark" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></symbol>
    <symbol id="ic-chevron" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
    <symbol id="ic-contacts" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="10" cy="7" r="4"/><path d="M20 8v6M23 11h-6"/></symbol>
  </svg>

  <header class="app-bar">
    <div class="app-bar-top">
      <h1 class="app-title">행정전화부</h1>
      <button id="settings-btn" class="icon-btn icon-btn--bar" aria-label="설정 및 백업">
        <svg class="ic" aria-hidden="true"><use href="#ic-settings"/></svg>
      </button>
    </div>
    <div class="search-wrap">
      <svg class="ic search-ico" aria-hidden="true"><use href="#ic-search"/></svg>
      <input id="search-input" class="search-input" type="search" role="searchbox"
             aria-label="연락처 검색"
             placeholder="이름·부서·전화번호 검색" autocomplete="off" enterkeyhint="search" />
      <button id="search-clear" class="search-clear" aria-label="검색 지우기" hidden>
        <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
      </button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="연락처 목록 필터">
    <button class="tab is-active" data-tab="all" role="tab" id="tab-all"
            aria-selected="true" aria-controls="list">전체</button>
    <button class="tab" data-tab="favorites" role="tab" id="tab-favorites"
            aria-selected="false" aria-controls="list" tabindex="-1">즐겨찾기</button>
    <button class="tab" data-tab="recent" role="tab" id="tab-recent"
            aria-selected="false" aria-controls="list" tabindex="-1">최근</button>
  </nav>

  <main id="list" class="list" role="tabpanel" tabindex="0" aria-labelledby="tab-all"></main>
  <p id="result-status" class="sr-only" role="status" aria-live="polite"></p>

  <!-- 상세 화면 (오버레이) -->
  <section id="detail" class="detail" role="dialog" aria-modal="true"
           aria-labelledby="detail-bar-title" hidden>
    <header class="detail-bar">
      <button id="detail-back" class="icon-btn" aria-label="뒤로">
        <svg class="ic" aria-hidden="true"><use href="#ic-back"/></svg>
      </button>
      <span class="detail-bar-title" id="detail-bar-title">연락처 정보</span>
      <button id="detail-fav" class="icon-btn" aria-label="즐겨찾기 추가" aria-pressed="false">
        <svg class="ic" aria-hidden="true"><use href="#ic-star"/></svg>
      </button>
    </header>
    <div id="detail-body" class="detail-body"></div>
  </section>

  <!-- 설정 / 백업·복구 (오버레이) -->
  <section id="settings" class="detail" role="dialog" aria-modal="true"
           aria-labelledby="settings-bar-title" hidden>
    <header class="detail-bar">
      <button id="settings-back" class="icon-btn" aria-label="뒤로">
        <svg class="ic" aria-hidden="true"><use href="#ic-back"/></svg>
      </button>
      <span class="detail-bar-title" id="settings-bar-title">설정</span>
    </header>
    <div class="detail-body">
      <div class="info-card">
        <div class="info-row">
          <span class="info-ico"><svg class="ic" aria-hidden="true"><use href="#ic-bookmark"/></svg></span>
          <div class="info-text">
            <div class="info-label">저장된 데이터</div>
            <div class="info-value" id="settings-counts">즐겨찾기 0 · 최근 0</div>
          </div>
        </div>
      </div>

      <div class="settings-section-title">데이터 백업 / 복구</div>
      <div class="info-card">
        <button class="settings-action" id="export-btn">
          <span class="info-ico"><svg class="ic" aria-hidden="true"><use href="#ic-download"/></svg></span>
          <div class="info-text">
            <div class="info-value">백업 내보내기</div>
            <div class="info-label">즐겨찾기·최근을 JSON 파일로 저장</div>
          </div>
        </button>
        <button class="settings-action" id="import-btn">
          <span class="info-ico"><svg class="ic" aria-hidden="true"><use href="#ic-upload"/></svg></span>
          <div class="info-text">
            <div class="info-value">백업 가져오기</div>
            <div class="info-label">JSON 백업 파일에서 복구(병합)</div>
          </div>
        </button>
      </div>
      <p class="settings-note">
        가져오기는 기존 데이터에 <b>병합</b>됩니다. 모든 데이터는 <b>기기 안에서만</b> 관리되며,
        백업은 서버 업로드가 아니라 파일 다운로드/업로드입니다. 연락처 정보 자체는 앱에 포함되어
        백업 대상이 아니고, 개인 설정(즐겨찾기·최근)만 백업됩니다.
      </p>
    </div>
    <input id="import-file" type="file" accept="application/json,.json" hidden />
  </section>

  <!-- 설치 안내 토스트 -->
  <div id="install-toast" class="toast" role="status" hidden>
    <span>홈 화면에 설치할 수 있어요</span>
    <button id="install-btn" class="toast-btn">설치</button>
    <button id="install-dismiss" class="toast-dismiss" aria-label="닫기">
      <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
    </button>
  </div>

  <div id="update-toast" class="toast" role="status" hidden>
    <span>새 버전이 있습니다</span>
    <button id="update-btn" class="toast-btn">새로고침</button>
    <button id="update-dismiss" class="toast-dismiss" aria-label="닫기">
      <svg class="ic" aria-hidden="true"><use href="#ic-close"/></svg>
    </button>
  </div>

  <script src="js/storage.js"></script>
  <script src="js/data.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
